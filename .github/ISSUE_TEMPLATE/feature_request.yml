name: Feature request
description: Suggest a user-facing improvement or integration
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: dropdown
    id: component
    attributes:
      label: Area
      options:
        - Prompt-as-Slide authoring
        - Deck Verdict
        - TTS backend
        - Subtitle or timing workflow
        - Anchor detection or rendering
        - Presentation-file integration
        - Platform support
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Presentation use case
      description: What are you preparing, and where does the current workflow fall short?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe what the user should be able to do and what result they should receive.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I may be able to test this with a non-confidential example.
        - label: I may be able to help implement this.
